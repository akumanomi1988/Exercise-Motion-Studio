[project]
name = "exercise-motion-studio"
version = "0.1.0"
description = "Commercial-safe exercise motion capture pipeline: bootstrap CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ems = "ems.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src/motion_pipeline"}
packages = ["ems"]
