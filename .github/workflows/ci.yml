name: Python and media ingestion checks

on:
  push:
    branches: [main]
    paths:
      - 'src/motion_pipeline/**'
      - 'tests/unit/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/motion_pipeline/**'
      - 'tests/unit/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  python-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg for media integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check required media binaries
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Compile and unit tests
        env:
          PYTHONPATH: src/motion_pipeline
        run: |
          python -m compileall -q src/motion_pipeline/ems
          python -m unittest discover -s tests/unit -v
          python -m ems doctor
